# Mọi tham số thí nghiệm nằm ở đây; bản sao được ghi vào dòng đầu của mỗi file log session.
policy: fixed            # naive | fixed | adaptive | abstain | combined
recognizer: rule           # rf (Random Forest) | rule (luật hình học, không cần model)
model_path: models/rf.pkl
camera_index: 0
preview_width: 480       # độ rộng cửa sổ camera (px)
preview_topmost: true    # luôn nổi trên cùng, để thấy HUD khi PowerPoint đang toàn màn hình (false nếu che slide)
status_every_s: 5  
dry_run: true            # true: chỉ ghi phím định gửi, không gửi thật
log_dir: sessions

window_ms: 150           # cửa sổ làm mượt đặc trưng
arm_hold_ms: 300         # giữ cử chỉ ARM bao lâu để vào ARMED
armed_timeout_ms: 4000   # ARMED tự hết hạn
conf: 0.80     
command_hold_ms:  
  exit_show: 500           # giơ 3 ngón: thoát trình chiếu
play_pause: 500          # nắm tay: giữ lâu hơn vì bàn tay hay nắm lại khi nghỉ
confirm_commands: [exit_show]   # lệnh cần xác nhận: giơ like = đồng ý, dislike = hủy
confirm_hold_ms: 400     # giữ like bao lâu thì xác nhận
confirm_timeout_ms: 5000 # không like/dislike trong ngần này thì về IDLE
hold_ms: 400             # hold_frames=5 (~170 ms ở 30 fps);
cooldown_ms: 1000        # cooldown_frames=20 (~670 ms ở 30 fps)
margin: 0.25             # abstain: chênh lệch top-1/top-2 tối thiểu
uncertain_floor: 0.40

speed_floor: 0.6         # adaptive
speed_gain: 0.08
max_boost: 0.15
hold_gain: 0.25

keymap:                  # gesture_to_slide_action
  next: right
  previous: left
  exit_show: esc  
  play_pause: space
