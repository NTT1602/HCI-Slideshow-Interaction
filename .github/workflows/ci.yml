# CI: chạy mỗi lần push lên main và mỗi pull request. Không cần webcam, mediapipe hay tensorflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true        # push mới thì hủy lần chạy cũ của cùng nhánh

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint (lỗi cú pháp, tên chưa định nghĩa)
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Test
        run: python -m pytest -m "not gui and not hardware" -q
