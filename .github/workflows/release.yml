# CD: khi đẩy tag dạng v1.0.0 thì chạy test, đóng gói mã nguồn thành zip và tạo GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write                 # cần để tạo Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -m "not gui and not hardware" -q
      - name: Đóng gói mã nguồn
        run: git archive --format=zip --prefix=sgic-${{ github.ref_name }}/ -o sgic-${{ github.ref_name }}.zip HEAD
      - name: Tạo Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "sgic-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
